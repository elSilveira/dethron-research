[package]
name = "tron-v2"
default-run = "tron-v2"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Measurable TRONs with bounded ternary DNA and private lineage"

[dependencies]
ring = "0.17.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
